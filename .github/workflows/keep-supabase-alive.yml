name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 AM UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Secrets Configuration
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ ERROR: SUPABASE_URL secret is missing in GitHub Settings!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "❌ ERROR: SUPABASE_ANON_KEY secret is missing in GitHub Settings!"
            exit 1
          fi
          echo "✓ All secrets are configured properly."

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase REST API Root..."
          
          # Remove trailing slash from URL if present
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's/*$//')
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$CLEAN_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "Supabase HTTP Response Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Supabase ping successful (Status Code $HTTP_STATUS)! Project is awake and active."
          else
            echo "❌ Ping failed with HTTP Status Code: $HTTP_STATUS"
            exit 1
          fi
