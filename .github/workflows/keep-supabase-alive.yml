name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 06:00 AM UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase PostgREST API..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          STATUS_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | awk -F':' '{print $2}')
          echo "Response Status: $STATUS_CODE"

          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 300 ] || [ "$STATUS_CODE" -eq 400 ]; then
            echo "✅ Supabase ping successful! Project is awake."
          else
            echo "❌ Ping failed with status code: $STATUS_CODE"
            exit 1
          fi
